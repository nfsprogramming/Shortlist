name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests prior to packaging
        run: |
          python -m unittest discover -s tests -v

      - name: Package application archive
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ZIP_NAME="shortlist-${GITHUB_REF_NAME}.zip"
          zip -r "${ZIP_NAME}" . -x "*.git*" "*__pycache__*" "*.pyc" "venv/*" ".venv/*" "release/*"
          sha256sum "${ZIP_NAME}" > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shortlist-${{ github.ref_name }}.zip
            checksums.txt
          generate_release_notes: true
